spring.application.name=frota

# Configuração da Base de Dados H2 (Em memória para desenvolvimento)
spring.datasource.url=jdbc:h2:mem:frotasdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Hibernate / JPA (Gera as tabelas automaticamente com base nas classes)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Habilitar consola web do H2 (Para visualizar as tabelas no navegador)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console